<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chaitali's Artbizz — Imagine. We Will Create. | Custom Art, Portraits & Handcrafted Gifts</title>
    <meta name="description" content="Chaitali's Artbizz offers custom portraits, handcrafted art, personalised gifts, resin art, digital designs and much more. Imagine it — we will create it." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chaitali's Artbizz — Imagine. We Will Create." />
    <meta property="og:description" content="Custom portraits, resin art, digital designs and personalised handcrafted gifts made with love." />
    <meta property="og:image" content="/logo.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chaitali's Artbizz — Imagine. We Will Create." />
    <meta name="twitter:description" content="Custom art, portraits & handcrafted gifts crafted with passion." />
    <meta name="twitter:image" content="/logo.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preload" as="image" href="/logo.jpg" fetchpriority="high" />
    <!-- Non-blocking async font load: media="print" trick prevents render-blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="root">
      <style>
        #initial-loader { position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; overflow: hidden; background: linear-gradient(135deg, #1A1A1A 0%, #2C2C2C 30%, #3D2E1E 60%, #1A1A1A 100%); font-family: sans-serif; }
        #initial-loader-content { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 16px; height: 100%; margin-bottom: 2rem; }
        #initial-logo-container { width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 9999px; border: 2px solid rgba(201, 168, 76, 0.5); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); margin: 0 auto 1.5rem auto; }
        #initial-logo { width: 100%; height: 100%; object-fit: cover; border-radius: 9999px; }
        #initial-title { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.1em; color: #F0DFA0; margin-bottom: 0.5rem; }
        #initial-subtitle { font-size: 0.875rem; color: #C9A84C; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 300; margin: 0; }
        @media (min-width: 768px) {
          #initial-logo-container { width: 224px; height: 224px; }
          #initial-title { font-size: 2.25rem; }
        }
      </style>
      <div id="initial-loader">
        <div id="initial-loader-content">
          <div id="initial-logo-container">
            <img src="/logo.jpg" alt="Chaitali's Artbizz Logo" id="initial-logo" width="224" height="224" fetchpriority="high" />
          </div>
          <h1 id="initial-title">CHAITALI'S ARTBIZZ</h1>
          <p id="initial-subtitle">Fine Art Gallery</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
